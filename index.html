<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Studio - Mira Mod Packer</title>
    <!-- Include JSZip for client-side packaging -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1020;
            --panel-bg: #1a1b35;
            --accent-color: #38c7ff;
            --text-color: #e0e0e0;
            --border-color: #2e315e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            color: #8a8db4;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #8a8db4;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: #0f1020;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #b4b7df;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #111226;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button.action-btn {
            width: 100%;
            background: var(--accent-color);
            color: #0f1020;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button.action-btn:hover {
            opacity: 0.9;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <h1>Modifier Studio</h1>
    <p class="subtitle">Cross-Platform Game Modding & Packaging Suite</p>

    <div class="container">
        <!-- Platform Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ios')">iOS (Mira)</button>
            <button class="tab-btn" onclick="switchTab('android')">Android</button>
            <button class="tab-btn" onclick="switchTab('pc')">PC (BepInEx)</button>
        </div>

        <!-- iOS Tab Content -->
        <div id="ios" class="tab-content active">
            <div class="form-group">
                <label>Upload Among Us Base IPA:</label>
                <input type="file" id="ipaFile" accept=".ipa,.zip">
            </div>
            <div class="form-group">
                <label>Upload Compiled Dylib (libMiraHostMod.dylib):</label>
                <input type="file" id="dylibFile" accept=".dylib">
            </div>
            <button class="action-btn" onclick="packageIOSMod()">Package Mira iOS IPA</button>
        </div>

        <!-- Android Tab Content -->
        <div id="android" class="tab-content">
            <div class="form-group">
                <label>Upload Among Us Base APK:</label>
                <input type="file" id="apkFile" accept=".apk">
            </div>
            <button class="action-btn" onclick="alert('Android packaging ready via template framework.')">Package APK</button>
        </div>

        <!-- PC Tab Content -->
        <div id="pc" class="tab-content">
            <div class="form-group">
                <label>Upload BepInEx C# Plugin (.dll):</label>
                <input type="file" id="dllFile" accept=".dll">
            </div>
            <button class="action-btn" onclick="alert('PC packaging ready.')">Package Plugin</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        function switchTab(platform) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(platform).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function packageIOSMod() {
            const ipaInput = document.getElementById('ipaFile');
            const dylibInput = document.getElementById('dylibFile');
            const statusDiv = document.getElementById('status');

            if (!ipaInput.files.length || !dylibInput.files.length) {
                alert("Please select both the Base IPA and the compiled libMiraHostMod.dylib file!");
                return;
            }

            statusDiv.innerText = "Reading files into memory...";

            try {
                const zip = new JSZip();
                const ipaData = await ipaInput.files[0].arrayBuffer();
                const dylibData = await dylibInput.files[0].arrayBuffer();

                statusDiv.innerText = "Unpacking base IPA structure...";
                const loadedZip = await zip.loadAsync(ipaData);

                // Find app folder dynamically inside Payload/
                let appFolderName = "";
                let payloadPath = "Payload/";
                
                let foundApp = false;
                loadedZip.folder("Payload").forEach((relativePath, file) => {
                    if (!foundApp && relativePath.endsWith(".app/")) {
                        appFolderName = relativePath.split('/')[0];
                        foundApp = true;
                    }
                });

                if (!appFolderName) {
                    throw new Error("Invalid IPA structure: .app bundle not found inside Payload/");
                }

                statusDiv.innerText = "Injecting Mira Frameworks & Dylib...";
                const targetDir = `Payload/${appFolderName}/Frameworks/`;
                
                // Add dylib to Frameworks directory
                loadedZip.file(targetDir + "libMiraHostMod.dylib", dylibData);

                statusDiv.innerText = "Generating modified IPA bundle...";
                const content = await loadedZip.generateAsync({ 
                    type: "blob",
                    compression: "DEFLATE",
                    compressionOptions: { level: 6 }
                });

                statusDiv.innerText = "Preparing secure download link...";
                
                // Force safe blob download to avoid browser hangups
                let blobUrl = URL.createObjectURL(content);
                let downloadLink = document.createElement('a');
                downloadLink.href = blobUrl;
                downloadLink.download = "Mira-Modded-AmongUs.ipa";
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                
                setTimeout(() => {
                    document.body.removeChild(downloadLink);
                    window.URL.revokeObjectURL(blobUrl);
                }, 200);

                statusDiv.innerText = "Success! Mira IPA packaged and downloaded.";

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
